<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <title>Storage Checker</title>
</head>
<body>
  <header>
    <div id="mode-toggle">
      <button id="btn-storage">STORAGE</button>
      <button id="btn-store">STORE</button>
    </div>
    <button id="btn-list">List (0)</button>
    <button id="btn-bring">Bring (0)</button>
  </header>
  <p id="mode-hint"></p>
  <main>
    <video id="video" playsinline muted autoplay></video>
    <div id="scan-error"></div>
    <div id="overlay"></div>
  </main>
  <section id="view-list">
    <header>
      <button id="btn-close-list">← Back to scanning</button>
      <span id="list-count"></span>
    </header>
    <input id="search" type="search" placeholder="Search name or barcode" />
    <ul id="items"></ul>
  </section>
  <section id="view-bring">
    <header>
      <button id="btn-close-bring">← Back to scanning</button>
      <span id="bring-count"></span>
    </header>
    <ul id="bring-items"></ul>
  </section>
  <script type="module" src="src/ui/main.ts"></script>
</body>
</html>
